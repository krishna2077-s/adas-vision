services:
  - type: web
    name: adas-vision
    env: python
    region: oregon
    plan: free
    branch: feature/scenario-lab
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_PYTHON_SIM
        value: "1"
